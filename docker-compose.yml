# Unraid / any Docker host deployment for the API, split-hosting-ready (Pages + Tunnel).
#
# api: the FastAPI backend, built by .github/workflows/docker-publish.yml on every push to main
#      and published to GHCR - this compose file only ever pulls that image, never builds locally.
#      Publishes port 8000 on the host so a separately-run Cloudflare Tunnel container (not part
#      of this stack - see README/chat instructions for pointing an existing tunnel at this
#      container) can reach it.
# watchtower: polls GHCR for a newer `latest` tag and auto-recreates ONLY the api container when
#      one appears - the command arg restricts it to that one container.
#
# Weights/models (recognizer .h5, char_lm.json, best_lambda.json, reading_dict.json, the Rung 1
# detection checkpoint) are gitignored (see .gitignore) and not baked into the image - copy your
# local experiments/ tree to EXPERIMENTS_DIR (set in .env) on the Unraid host before
# `docker compose up`. EXPERIMENTS_DIR is an absolute host path, not a relative one, since GUI
# compose managers (e.g. Unraid's Compose Manager Plus) run this file from their own project
# directory, not this repo checkout - a relative ./experiments would resolve against the wrong
# base and silently mount an empty directory.

services:
  api:
    image: ghcr.io/lyvuongvvh/chunomcameraocr-api:latest
    container_name: nomocr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${EXPERIMENTS_DIR}:/app/experiments:ro
    env_file:
      - .env

  watchtower:
    image: containrrr/watchtower:latest
    container_name: nomocr-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
    command: --interval 300 nomocr-api
